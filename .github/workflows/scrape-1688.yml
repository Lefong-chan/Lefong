name: Scrape 1688

# Runs the bot in scraper/ on GitHub's own servers instead of requiring the
# site owner's own PC/phone to be online - see scraper/README.md for why
# this exists at all (1688 blocks requests from Vercel's serverless IPs).
# GitHub Actions runners are also cloud/datacenter IPs, so there's a real
# chance 1688 blocks these too - this is the free, no-hardware-required
# option to try before giving up on live scraping entirely.
#
# Needs four repository secrets set first (Settings -> Secrets and
# variables -> Actions -> New repository secret), using the exact same
# values already set on Vercel (Vercel dashboard -> Project Settings ->
# Environment Variables): FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL,
# FIREBASE_PRIVATE_KEY, FIREBASE_DATABASE_URL.
#
# Use the "Run workflow" button on this workflow's Actions page to trigger
# it on demand instead of waiting for the schedule below.

on:
  schedule:
    # Runs are small on purpose now (see index.js) - a few keywords and a
    # couple of detail pages per run, stopping at the first sign of a
    # 1688 block - so running often in small batches covers the full
    # keyword list gradually across many fresh-IP runs, rather than one
    # long run that gets blocked partway through. Roughly ~5 min/run, so
    # every 2h stays well under the 2000 free minutes/month a private repo
    # gets (public repos have no Actions minute limit at all).
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # scraper/index.js imports api/_lib/firebaseAdmin.js, normalize.js,
      # etc. directly (shared with the site, see scraper/README.md) -
      # those live outside scraper/, so their own bare-specifier imports
      # (e.g. "firebase-admin") resolve from the repo root's node_modules,
      # not scraper's. Both installs are needed.
      - name: Install root dependencies
        run: npm ci

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        run: node index.js
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
